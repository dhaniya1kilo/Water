name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          set -o pipefail
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          unzip -o -q "$ZIP"
          DIR=$(dirname "$(find . -name gradlew -not -path '*/.git/*' | head -1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo '### Build failed - last lines:' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error|Error|FAILED|What went wrong" -A3 build.log | tail -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          mkdir -p $GITHUB_WORKSPACE/out
          cp app/build/outputs/apk/debug/*.apk $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: WatermarkCover-apk
          path: out/*.apk
